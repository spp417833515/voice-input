<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ollama Voice Input Lite</title>
    <style>
      :root {
        --bg: #f5f1e8;
        --card: #fffaf1;
        --ink: #1c2428;
        --muted: #66747b;
        --line: #dacfc0;
        --brand: #0f766e;
        --brand-2: #115e59;
        --hot: #b45309;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Noto Sans CJK SC", "PingFang SC", sans-serif;
        background:
          radial-gradient(circle at top right, #ffe8b8 0, transparent 25%),
          radial-gradient(circle at bottom left, #d9f1eb 0, transparent 32%),
          var(--bg);
        color: var(--ink);
      }

      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 38px;
      }

      .sub {
        margin: 0 0 24px;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 18px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 16px 50px rgba(28, 36, 40, 0.08);
      }

      .record {
        width: 100%;
        min-height: 220px;
        border: none;
        border-radius: 28px;
        background: linear-gradient(145deg, var(--brand), var(--brand-2));
        color: white;
        font-size: 28px;
        font-weight: 700;
        cursor: pointer;
      }

      .record.recording {
        background: linear-gradient(145deg, #dd6b20, var(--hot));
      }

      .field {
        margin-top: 14px;
      }

      .label {
        margin-bottom: 6px;
        font-size: 13px;
        color: var(--muted);
      }

      select,
      textarea,
      button.small,
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        font: inherit;
        background: white;
      }

      textarea {
        min-height: 190px;
        resize: vertical;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .status {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 14px;
        background: #f0ece4;
        color: var(--muted);
      }

      .kbd {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        border: 1px solid var(--line);
        border-bottom-width: 3px;
        background: white;
        font-size: 13px;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Ollama Voice Input Lite</h1>
      <p class="sub">轻量版：浏览器识别语音，Ollama 负责润色或翻译。页面聚焦时支持 <span class="kbd">Space</span> 和 <span class="kbd">Ctrl + `</span>。</p>

      <div class="grid">
        <section class="card">
          <button id="recordButton" class="record">按住说话</button>

          <div class="field">
            <div class="label">模式</div>
            <select id="mode">
              <option value="raw">仅转写</option>
              <option value="polish" selected>中文润色</option>
              <option value="translate_en">翻译成英文</option>
            </select>
          </div>

          <div class="field">
            <div class="label">识别语言</div>
            <select id="language">
              <option value="zh-CN" selected>中文</option>
              <option value="en-US">英文</option>
            </select>
          </div>

          <div class="field">
            <div class="label">Ollama 模型</div>
            <input id="model" value="qwen2.5:3b" />
          </div>

          <div id="status" class="status">准备中...</div>
        </section>

        <section class="card">
          <div class="field">
            <div class="label">原始转写</div>
            <textarea id="rawText" placeholder="浏览器识别出的文本"></textarea>
          </div>

          <div class="field">
            <div class="label">最终输出</div>
            <textarea id="finalText" placeholder="Ollama 整理后的文本"></textarea>
          </div>

          <div class="row field">
            <button id="copyRaw" class="small">复制原始转写</button>
            <button id="copyFinal" class="small">复制最终输出</button>
          </div>
        </section>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
  </html>
