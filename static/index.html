<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ollama Voice Input</title>
    <style>
      :root {
        --bg: #f4efe7;
        --panel: #fffaf3;
        --ink: #172126;
        --muted: #5f6b73;
        --line: #d7cbbd;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --recording: #c2410c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Noto Sans CJK SC", "PingFang SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #fff2cf 0, transparent 28%),
          radial-gradient(circle at bottom right, #d7f4ef 0, transparent 32%),
          var(--bg);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      h1 {
        margin: 0;
        font-size: 40px;
        line-height: 1.05;
      }

      .setup-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: white;
        color: var(--muted);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        transition: border-color 120ms, color 120ms;
      }
      .setup-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .sub {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 18px;
      }

      .panel {
        background: color-mix(in srgb, var(--panel) 92%, white);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 18px 50px rgba(23, 33, 38, 0.08);
      }

      .hero-button {
        width: 100%;
        min-height: 220px;
        border: none;
        border-radius: 28px;
        background: linear-gradient(145deg, var(--accent), var(--accent-strong));
        color: white;
        font-size: 28px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 140ms ease, filter 140ms ease;
      }

      .hero-button:hover {
        filter: brightness(1.05);
      }

      .hero-button:active,
      .hero-button.recording {
        transform: scale(0.985);
        background: linear-gradient(145deg, #dc6b2d, var(--recording));
      }

      .meta,
      .toolbar {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .label {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      select,
      textarea,
      button.small {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        font: inherit;
        background: white;
      }

      textarea {
        min-height: 200px;
        resize: vertical;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .status {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        background: #f0ede7;
        color: var(--muted);
        font-size: 14px;
      }

      .kbd {
        display: inline-block;
        border: 1px solid var(--line);
        border-bottom-width: 3px;
        border-radius: 10px;
        padding: 2px 8px;
        background: white;
        font-size: 13px;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <h1>Ollama Voice Input</h1>
        <a href="/setup" class="setup-btn">⚙ 环境配置</a>
      </div>
      <p class="sub">按住录音，松开发送。浏览器前台时支持 <span class="kbd">Space</span> 或 <span class="kbd">Ctrl + `</span>。</p>

      <div class="grid">
        <section class="panel">
          <button id="recordButton" class="hero-button">按住说话</button>

          <div class="meta">
            <div>
              <div class="label">模式</div>
              <select id="mode">
                <option value="raw">仅转写</option>
                <option value="polish" selected>中文润色</option>
                <option value="translate_en">翻译成英文</option>
              </select>
            </div>

            <div>
              <div class="label">识别语言</div>
              <select id="language">
                <option value="zh" selected>中文</option>
                <option value="en">英文</option>
                <option value="auto">自动检测</option>
              </select>
            </div>
          </div>

          <div id="status" class="status">准备中...</div>
        </section>

        <section class="panel">
          <div class="toolbar">
            <div>
              <div class="label">原始转写</div>
              <textarea id="rawText" placeholder="识别结果会先出现在这里"></textarea>
            </div>

            <div>
              <div class="label">最终输出</div>
              <textarea id="finalText" placeholder="润色或翻译后的结果会出现在这里"></textarea>
            </div>

            <div class="row">
              <button id="copyRaw" class="small">复制原始转写</button>
              <button id="copyFinal" class="small">复制最终输出</button>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
  </html>
